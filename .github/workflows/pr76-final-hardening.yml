name: PR 76 final hardening

on:
  push:
    branches: [agent/preserve-existing-arr-settings]

concurrency:
  group: pr76-final-hardening
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/preserve-existing-arr-settings
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused review fixes
        run: python3 scripts/finalize-pr76-hardening.py

      - name: Install
        run: npm ci

      - name: Verify typecheck
        run: npm run typecheck

      - name: Verify tests
        run: npm test

      - name: Verify build
        run: npm run build

      - name: Verify manifest
        run: npm run lint:manifest

      - name: Verify release package
        run: npm run package:release

      - name: Remove temporary scaffolding and publish
        run: |
          set -euo pipefail
          rm -f scripts/finalize-pr76-hardening.py .github/workflows/pr76-final-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden existing Arr item policy before merge'
          git push origin HEAD:agent/preserve-existing-arr-settings
