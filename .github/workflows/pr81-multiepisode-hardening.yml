name: PR81 multi-episode hardening

on:
  push:
    branches:
      - fix/dead-stream-mitigation-binge-continuity

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dead-stream-mitigation-binge-continuity
          fetch-depth: 1
      - name: Apply bounded cross-file hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
            path = Path(path_name)
            text = path.read_text()
            if text.count(old) != 1:
              raise SystemExit(f'{path_name}: expected target exactly once, found {text.count(old)}')
            path.write_text(text.replace(old, new))

          replace_once(
            'src/types.ts',
            """  };
            isAction?: boolean;
          }

          export interface ArrMovieStatus""",
            """  };
            bingeEligible?: boolean;
            isAction?: boolean;
          }

          export interface ArrMovieStatus"""
          )

          replace_once(
            'src/types.ts',
            """  seasonMonitored?: boolean;
            monitorNewItems?: 'all' | 'none';
          }

          export interface AddActionResult""",
            """  seasonMonitored?: boolean;
            monitorNewItems?: 'all' | 'none';
            sharedEpisodeFile?: boolean;
          }

          export interface AddActionResult"""
          )

          sonarr_path = Path('src/services/sonarr.ts')
          sonarr = sonarr_path.read_text()
          block_start = sonarr.find("      if (match.hasFile || (match.episodeFileId ?? 0) > 0) {")
          if block_start < 0:
            raise SystemExit('sonarr.ts: downloaded block not found')
          return_marker = "        return {\n          state: 'episode_downloaded',"
          return_pos = sonarr.find(return_marker, block_start)
          if return_pos < 0:
            raise SystemExit('sonarr.ts: downloaded return not found')
          shared_code = """        const sharedEpisodeFile = match.episodeFileId != null && match.episodeFileId > 0
            ? episodes.some((item) => item.id !== match.id && item.episodeFileId === match.episodeFileId)
            : false;
          """
          sonarr = sonarr[:return_pos] + shared_code + sonarr[return_pos:]
          size_marker = "          fileSizeBytes: match.episodeFile?.size\n        };"
          size_pos = sonarr.find(size_marker, return_pos + len(shared_code))
          if size_pos < 0:
            raise SystemExit('sonarr.ts: downloaded size return not found')
          sonarr = sonarr[:size_pos] + "          fileSizeBytes: match.episodeFile?.size,\n          sharedEpisodeFile\n        };" + sonarr[size_pos + len(size_marker):]
          sonarr_path.write_text(sonarr)

          status_path = Path('src/services/status.ts')
          status = status_path.read_text()
          episode_marker = "case 'episode_downloaded':"
          episode_pos = status.find(episode_marker)
          if episode_pos < 0:
            raise SystemExit('status.ts: episode_downloaded marker not found')
          external = "          externalUrl: kodiExternalUrl"
          external_pos = status.find(external, episode_pos)
          if external_pos < 0:
            raise SystemExit('status.ts: episode downloaded externalUrl target not found')
          status = status[:external_pos] + "          bingeEligible: fileUrl ? !status.sharedEpisodeFile : undefined,\n" + status[external_pos:]
          status_path.write_text(status)

          replace_once(
            'src/addon.ts',
            "if (isSeriesDirectFileUrl(tile.url) && isConfidentSingleEpisodeFilename(hints.filename)) {",
            "if (tile.bingeEligible && isSeriesDirectFileUrl(tile.url) && isConfidentSingleEpisodeFilename(hints.filename)) {"
          )

          replace_once(
            'test/dead-stream-mitigation.test.ts',
            """  return {
              name: 'File Ready',
              url: `${extensionUrl}/token/files/series/${fileId}?exp=9999999999&t=signed`,""",
            """  return {
              name: 'File Ready',
              bingeEligible: true,
              url: `${extensionUrl}/token/files/series/${fileId}?exp=9999999999&t=signed`,"""
          )
      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr81-multiepisode-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/services/sonarr.ts src/services/status.ts src/addon.ts test/dead-stream-mitigation.test.ts .github/workflows/pr81-multiepisode-hardening.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No hardening changes produced' >&2; exit 1; }
          git commit -m 'fix: suppress binge matching for shared Sonarr files'
          git push origin HEAD:fix/dead-stream-mitigation-binge-continuity
