name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress CI runs for the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Quality gates
        run: npm run ci

      - name: Release packaging smoke test
        run: npm run package:release

  cleanup-stale-actions-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete completed Actions cleanup branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for ref in \
            'chore%2Fpurge-obsolete-actions-registry' \
            'chore%2Ffinish-actions-registry-purge' \
            'chore%2Ffix-actions-purge-registration-race'; do
            if gh api --method DELETE "repos/${REPO}/git/refs/heads/${ref}" >/dev/null 2>&1; then
              echo "Deleted ${ref}"
            elif gh api "repos/${REPO}/git/ref/heads/${ref}" >/dev/null 2>&1; then
              echo "::error::Failed to delete ${ref}"
              exit 1
            else
              echo "Already absent: ${ref}"
            fi
          done
