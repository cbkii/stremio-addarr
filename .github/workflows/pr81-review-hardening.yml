name: PR81 review hardening

on:
  push:
    branches:
      - fix/dead-stream-mitigation-binge-continuity

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dead-stream-mitigation-binge-continuity
          fetch-depth: 1

      - name: Apply reviewed hardening
        run: python3 .github/pr81_harden.py

      - name: Remove helper files and commit
        run: |
          set -euo pipefail
          rm .github/pr81_harden.py .github/workflows/pr81-review-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No hardening changes produced' >&2; exit 1; }
          git commit -m 'fix: harden signed playback and correct Stremio lifecycle assumptions'
          git push origin HEAD:fix/dead-stream-mitigation-binge-continuity
