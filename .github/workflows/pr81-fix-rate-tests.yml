name: PR81 fix stale rate tests

on:
  push:
    branches:
      - fix/dead-stream-mitigation-binge-continuity

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dead-stream-mitigation-binge-continuity
          fetch-depth: 1
      - run: python3 .github/pr81_fix_rate_tests.py
      - name: Remove helper files and commit
        run: |
          set -euo pipefail
          rm .github/pr81_fix_rate_tests.py .github/workflows/pr81-fix-rate-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No test migration changes produced' >&2; exit 1; }
          git commit -m 'test: align file throttling coverage with signed media policy'
          git push origin HEAD:fix/dead-stream-mitigation-binge-continuity
